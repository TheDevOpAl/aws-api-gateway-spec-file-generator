# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "*" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type of version bump: major, minor, or patch'
        required: true
        default: 'patch'
      append_alpha:
        description: 'Append -alpha to the new version (true/false)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo Hello, world!

      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  bump-version:
    name: Bump version, tag and create release
    runs-on: ubuntu-latest
    # if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compute next tag from git tags
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
          APPEND_ALPHA: ${{ github.event.inputs.append_alpha }}
        run: |
          set -e
          echo "Bump type: $BUMP_TYPE"
          if [ "$BUMP_TYPE" != "major" ] && [ "$BUMP_TYPE" != "minor" ] && [ "$BUMP_TYPE" != "patch" ]; then
            echo "Invalid bump type: $BUMP_TYPE" >&2
            exit 1
          fi
          git fetch --tags
          LATEST_TAG=$(git tag --list "v*" --sort=-v:refname | head -n1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"
          VER=${LATEST_TAG#v}
          # strip prerelease (e.g. -alpha)
          BASE_VER=${VER%%-*}
          IFS='.' read -r MAJ MIN PAT <<< "$BASE_VER"
          MAJ=${MAJ:-0}
          MIN=${MIN:-0}
          PAT=${PAT:-0}
          case "$BUMP_TYPE" in
            major)
              MAJ=$((MAJ+1)); MIN=0; PAT=0;;
            minor)
              MIN=$((MIN+1)); PAT=0;;
            patch)
              PAT=$((PAT+1));;
          esac
          NEW_BASE="$MAJ.$MIN.$PAT"
          if [ "$APPEND_ALPHA" = "true" ]; then
            NEW_VER="$NEW_BASE-alpha"
          else
            NEW_VER="$NEW_BASE"
          fi
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=v${{ steps.bump.outputs.version }}
          echo "Creating tag $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          release_name: v${{ steps.bump.outputs.version }}
          body: "Release ${{ steps.bump.outputs.version }} (automated)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
