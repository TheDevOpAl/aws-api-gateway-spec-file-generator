name: CI

on:
  push:
    branches: ["main"]

jobs:
  bump-version:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged PR title
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const commitMessage = context.payload.head_commit.message;

            // Squash merge: PR title is always the first line
            const title = commitMessage.split('\n')[0].trim().replace(/\s*\(#\d+\)\s*$/, '').trim();

            if (!title) {
              core.setFailed('Could not extract PR title from commit message');
              return;
            }

            core.setOutput('title', title);

      - name: Compute next semantic version
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            const title = '${{ steps.pr.outputs.title }}';

            // Determine bump type from conventional commit prefix
            let bumpType = 'patch';

            if (/^[a-z]+(\(.+\))?!:/.test(title)) {
              // Any type with ! is a breaking change
              bumpType = 'major';
            } else if (/^feat(\(.+\))?:/.test(title)) {
              bumpType = 'minor';
            } else if (/^(fix|feat|chore|docs|ci|refactor|perf|test|style|build)(\(.+\))?:/.test(title)) {
              bumpType = 'patch';
            } else {
              core.setFailed(`PR title does not match conventional commit format: "${title}"`);
              return;
            }

            // Get latest semver tag
            execSync('git fetch --tags');
            let latestTag = '';
            try {
              latestTag = execSync('git tag --list "v*" --sort=-v:refname | head -n1', { encoding: 'utf8' }).trim();
            } catch (e) {
              latestTag = '';
            }

            if (!latestTag) latestTag = 'v0.0.0';

            // Parse and bump
            const baseVer = latestTag.replace(/^v/, '').split('-')[0];
            let [maj, min, pat] = baseVer.split('.').map(x => parseInt(x) || 0);

            switch (bumpType) {
              case 'major': maj++; min = 0; pat = 0; break;
              case 'minor': min++; pat = 0; break;
              case 'patch': pat++; break;
            }

            const newVersion = `${maj}.${min}.${pat}`;
            core.setOutput('version', newVersion);

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.bump.outputs.version }}"
          echo "Creating tag $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.bump.outputs.version }}`,
              name: `v${{ steps.bump.outputs.version }}`,
              generate_release_notes: true,
              draft: false,
              prerelease: `v${{ steps.bump.outputs.version }}`.includes('-'),
            });

  publish:
    name: Publish to npm
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update package.json version
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync, writeFileSync } = require('fs');
            const path = require('path');

            const packageJsonPath = path.join(process.cwd(), 'package.json');
            const packageJson = JSON.parse(readFileSync(packageJsonPath, 'utf8'));

            packageJson.version = '${{ needs.bump-version.outputs.version }}';

            writeFileSync(packageJsonPath, JSON.stringify(packageJson, null, 2) + '\n');

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          npm publish --provenance --access public
