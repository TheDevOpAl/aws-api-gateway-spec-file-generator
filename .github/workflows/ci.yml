name: CI

on:
  push:
    branches: ["main"]

jobs:
  bump-version:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged PR title
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 1,
            });

            const commitMessage = commits.data[0].commit.message;
            console.log('Commit message:', commitMessage);

            // The merge commit message starts with "Merge pull request #N"
            // and the PR title appears on the third line. For squash merges,
            // the PR title is the commit message subject (first line).
            const lines = commitMessage.split('\n').filter(l => l.trim());
            let title;

            if (lines[0].startsWith('Merge pull request')) {
              title = lines[2]?.trim();
            } else {
              title = lines[0].trim();
            }

            if (!title) {
              core.setFailed('Could not extract PR title from commit message');
              return;
            }

            console.log('PR title:', title);
            core.setOutput('title', title);

      - name: Compute next semantic version
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            const title = '${{ steps.pr.outputs.title }}';
            console.log('PR title:', title);

            // Determine bump type from conventional commit prefix
            let bumpType = 'patch';

            if (/^[a-z]+(\(.+\))?!:/.test(title)) {
              // Any type with ! is a breaking change
              bumpType = 'major';
            } else if (/^feat(\(.+\))?:/.test(title)) {
              bumpType = 'minor';
            } else if (/^(fix|feat|chore|docs|ci|refactor|perf|test|style|build)(\(.+\))?:/.test(title)) {
              bumpType = 'patch';
            } else {
              core.setFailed(`PR title does not match conventional commit format: "${title}"`);
              return;
            }

            console.log('Bump type:', bumpType);

            // Get latest semver tag
            execSync('git fetch --tags');
            let latestTag = '';
            try {
              latestTag = execSync('git tag --list "v*" --sort=-v:refname | head -n1', { encoding: 'utf8' }).trim();
            } catch (e) {
              latestTag = '';
            }

            if (!latestTag) latestTag = 'v0.0.0';
            console.log('Latest tag:', latestTag);

            // Parse and bump
            const baseVer = latestTag.replace(/^v/, '').split('-')[0];
            let [maj, min, pat] = baseVer.split('.').map(x => parseInt(x) || 0);

            switch (bumpType) {
              case 'major': maj++; min = 0; pat = 0; break;
              case 'minor': min++; pat = 0; break;
              case 'patch': pat++; break;
            }

            const newVersion = `${maj}.${min}.${pat}`;
            console.log('New version:', newVersion);
            core.setOutput('version', newVersion);

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.bump.outputs.version }}"
          echo "Creating tag $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  update-package-version:
    name: Update package.json version
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update package.json version
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version

      - name: Commit updated package.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: set version to ${{ needs.bump-version.outputs.version }} [skip ci]"
          git push origin HEAD:main

  publish:
    name: Publish to npm
    needs: [bump-version, update-package-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          npm publish --provenance --access public
