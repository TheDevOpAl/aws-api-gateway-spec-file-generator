name: Publish to npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["*"]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        uses: actions/github-script@v7
        id: get-tag
        with:
          script: |
            const { execSync } = require('child_process');
            
            // Get the latest tag
            let latestTag = '';
            try {
              latestTag = execSync('git describe --tags $(git rev-list --tags --max-count=1)', { encoding: 'utf8' }).trim();
            } catch (e) {
              console.log('No tags found');
              latestTag = '';
            }
            
            console.log('Latest tag:', latestTag);
            core.setOutput('tag', latestTag);
            
            if (!latestTag) {
              core.setFailed('No tag found');
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add version to package.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const tagName = '${{ steps.get-tag.outputs.tag }}';
            console.log('Setting version from tag:', tagName);
            
            // Remove 'v' prefix if present
            const version = tagName.startsWith('v') ? tagName.slice(1) : tagName;
            
            // Read package.json
            const packageJsonPath = path.join(process.cwd(), 'package.json');
            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
            
            // Update version
            packageJson.version = version;
            
            // Write back
            fs.writeFileSync(packageJsonPath, JSON.stringify(packageJson, null, 2) + '\n');
            
            console.log('Updated package.json version to:', version);

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
